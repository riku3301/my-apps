<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オリジナルガチャシミュレーター</title>
<style>
  :root {
    --bg-color: #fdf6f5;
    --card-bg: #ffffff;
    --main-pink: #f4a2a2;
    --sub-pink: #fce4e4;
    --text-brown: #5c4b4b;
    --ssr-gold: #ffd700;
    --sr-purple: #c59bf5;
    --r-blue: #9bcbf5;
  }

  * {
    box-sizing: border-box;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: var(--text-brown);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  header {
    width: 100%;
    background-color: #fff;
    padding: 15px 20px;
    box-shadow: 0 2px 10px rgba(92, 75, 75, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 800px;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
  }

  h1 {
    font-size: 1.2rem;
    margin: 0;
    color: var(--text-brown);
  }

  .nav-tabs {
    display: flex;
    gap: 10px;
  }

  .tab-btn {
    background: var(--sub-pink);
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    color: var(--text-brown);
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }

  .tab-btn.active {
    background: var(--main-pink);
    color: #fff;
  }

  main {
    width: 100%;
    max-width: 800px;
    padding: 20px;
    flex: 1;
  }

  .section {
    display: none;
  }

  .section.active {
    display: block;
  }

  /* ガチャ画面 */
  .banner-box {
    background: #fff;
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(92, 75, 75, 0.06);
    margin-bottom: 20px;
    border: 2px dashed var(--main-pink);
  }

  .banner-title {
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .rate-info {
    font-size: 0.85rem;
    color: #8c7a7a;
    margin-bottom: 20px;
  }

  .gacha-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
  }

  .btn-pull {
    background: linear-gradient(135deg, #f7b2b2, #f08c8c);
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(240, 140, 140, 0.4);
    transition: transform 0.1s;
  }

  .btn-pull:active {
    transform: scale(0.96);
  }

  .btn-pull.ten {
    background: linear-gradient(135deg, #f5c27a, #eb9f44);
    box-shadow: 0 4px 10px rgba(235, 159, 68, 0.4);
  }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 12px 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    font-size: 0.9rem;
  }

  /* 結果表示エリア */
  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .card {
    background: #fff;
    border-radius: 15px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    opacity: 0;
    transform: scale(0.8);
  }

  @keyframes popIn {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .card.SSR {
    border: 3px solid var(--ssr-gold);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    background: linear-gradient(to bottom, #fffdf0, #fff);
  }

  .card.SR {
    border: 2px solid var(--sr-purple);
  }

  .card.R {
    border: 2px solid var(--r-blue);
  }

  .rarity-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: bold;
    color: #fff;
  }

  .SSR .rarity-badge { background: #e6b800; }
  .SR .rarity-badge { background: #a875e8; }
  .R .rarity-badge { background: #6baee8; }

  .card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 10px;
    background: #f0f0f0;
    margin-bottom: 8px;
  }

  .card-name {
    font-size: 0.85rem;
    font-weight: bold;
    word-break: break-all;
  }

  /* 設定画面 */
  .settings-card {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(92, 75, 75, 0.05);
  }

  .settings-card h2 {
    font-size: 1.1rem;
    margin-top: 0;
    border-bottom: 2px solid var(--sub-pink);
    padding-bottom: 8px;
  }

  .rate-inputs {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }

  .rate-inputs label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: bold;
  }

  .rate-inputs input {
    width: 60px;
    padding: 6px;
    border: 1px solid #ddd;
    border-radius: 8px;
    text-align: right;
  }

  .upload-area {
    border: 2px dashed var(--main-pink);
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    background: var(--bg-color);
    cursor: pointer;
    margin-bottom: 15px;
  }

  .item-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-color);
    padding: 10px;
    border-radius: 12px;
  }

  .item-row img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 8px;
    background: #fff;
  }

  .item-row input[type="text"] {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
  }

  .item-row select {
    padding: 6px;
    border: 1px solid #ddd;
    border-radius: 8px;
  }

  .btn-del {
    background: #ff8a8a;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
  }

  .btn-small {
    background: var(--text-brown);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>✨ マイガチャ</h1>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('gacha')">ガチャを回す</button>
    <button class="tab-btn" onclick="switchTab('settings')">設定・画像登録</button>
  </div>
</header>

<main>
  <!-- ガチャ実行画面 -->
  <div id="tab-gacha" class="section active">
    <div class="banner-box">
      <div class="banner-title" id="display-title">スペシャルピックアップガチャ</div>
      <div class="rate-info" id="display-rates">排出率：SSR 5% / SR 20% / R 75%</div>
      <div class="gacha-buttons">
        <button class="btn-pull" onclick="pullGacha(1)">1回引く</button>
        <button class="btn-pull ten" onclick="pullGacha(10)">10連引く</button>
      </div>
    </div>

    <div class="stats-bar">
      <span>累計回数：<strong id="total-pulls">0</strong> 回</span>
      <button class="btn-small" onclick="resetStats()">カウントリセット</button>
    </div>

    <div id="result-area" class="result-grid"></div>
  </div>

  <!-- 設定・画像登録画面 -->
  <div id="tab-settings" class="section">
    <div class="settings-card">
      <h2>基本設定・排出確率（合計100%になるようにしてね）</h2>
      <div style="margin-bottom: 15px;">
        <label>ガチャタイトル：</label>
        <input type="text" id="gacha-title-input" style="padding: 6px; border-radius: 8px; border: 1px solid #ddd; width: 60%;" onchange="saveSettings()">
      </div>
      <div class="rate-inputs">
        <label>SSR (%) <input type="number" id="rate-ssr" min="0" max="100" onchange="saveSettings()"></label>
        <label>SR (%) <input type="number" id="rate-sr" min="0" max="100" onchange="saveSettings()"></label>
        <label>R (%) <input type="number" id="rate-r" min="0" max="100" onchange="saveSettings()"></label>
      </div>
    </div>

    <div class="settings-card">
      <h2>カードの登録・編集</h2>
      <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <p style="margin:0; font-weight:bold;">📁 ここをタップして画像を追加（複数選択OK）</p>
        <p style="margin:5px 0 0; font-size:0.8rem; color:#888;">※ブラウザ内に自動保存されます</p>
        <input type="file" id="file-input" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
      </div>
      <div id="item-list" class="item-list"></div>
    </div>

    <div class="settings-card">
      <h2>データのバックアップ・復元</h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn-small" onclick="exportData()">データ書き出し (JSON)</button>
        <button class="btn-small" onclick="document.getElementById('import-file').click()">データ読み込み (JSON)</button>
        <button class="btn-del" onclick="resetAllData()">初期サンプルに戻す</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this.files[0])">
      </div>
    </div>
  </div>
</main>

<script>
  // サンプル用のダミー画像生成（SVG）
  function createSampleSVG(text, bgColor) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="${bgColor}"/>
      <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#5c4b4b">${text}</text>
    </svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  const defaultData = {
    title: "スペシャルピックアップガチャ",
    rates: { SSR: 5, SR: 20, R: 75 },
    totalPulls: 0,
    items: [
      { id: 1, name: "推しのSSRカード", rarity: "SSR", img: createSampleSVG("★SSR★", "#fff3b0") },
      { id: 2, name: "カフェの思い出", rarity: "SR", img: createSampleSVG("SR 1", "#e8d7ff") },
      { id: 3, name: "お出かけスナップ", rarity: "SR", img: createSampleSVG("SR 2", "#e8d7ff") },
      { id: 4, name: "日常のひとコマA", rarity: "R", img: createSampleSVG("R 1", "#d7ecff") },
      { id: 5, name: "日常のひとコマB", rarity: "R", img: createSampleSVG("R 2", "#d7ecff") },
      { id: 6, name: "日常のひとコマC", rarity: "R", img: createSampleSVG("R 3", "#d7ecff") }
    ]
  };

  let appData = JSON.parse(localStorage.getItem("myGachaData")) || JSON.parse(JSON.stringify(defaultData));

  function saveData() {
    try {
      localStorage.setItem("myGachaData", JSON.stringify(appData));
    } catch (e) {
      alert("画像サイズが大きすぎて保存容量を超えたかも！少し画像を減らすか、小さい画像にしてみてね。");
    }
    updateUI();
  }

  function updateUI() {
    document.getElementById("display-title").textContent = appData.title;
    document.getElementById("display-rates").textContent = `排出率：SSR ${appData.rates.SSR}% / SR ${appData.rates.SR}% / R ${appData.rates.R}%`;
    document.getElementById("total-pulls").textContent = appData.totalPulls;

    document.getElementById("gacha-title-input").value = appData.title;
    document.getElementById("rate-ssr").value = appData.rates.SSR;
    document.getElementById("rate-sr").value = appData.rates.SR;
    document.getElementById("rate-r").value = appData.rates.R;

    const listEl = document.getElementById("item-list");
    listEl.innerHTML = "";
    appData.items.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = `
        <img src="${item.img}" alt="">
        <input type="text" value="${item.name}" onchange="updateItemName(${index}, this.value)">
        <select onchange="updateItemRarity(${index}, this.value)">
          <option value="SSR" ${item.rarity === "SSR" ? "selected" : ""}>SSR</option>
          <option value="SR" ${item.rarity === "SR" ? "selected" : ""}>SR</option>
          <option value="R" ${item.rarity === "R" ? "selected" : ""}>R</option>
        </select>
        <button class="btn-del" onclick="deleteItem(${index})">削除</button>
      `;
      listEl.appendChild(row);
    });
  }

  function switchTab(tabName) {
    document.querySelectorAll(".section").forEach(el => el.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
    document.getElementById(`tab-${tabName}`).classList.add("active");
    event.target.classList.add("active");
  }

  function saveSettings() {
    appData.title = document.getElementById("gacha-title-input").value;
    appData.rates.SSR = Number(document.getElementById("rate-ssr").value);
    appData.rates.SR = Number(document.getElementById("rate-sr").value);
    appData.rates.R = Number(document.getElementById("rate-r").value);
    saveData();
  }

  // 画像リサイズ＆読み込み（容量節約のため最大400pxに縮小）
  function handleFiles(files) {
    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxSize = 400;
          let width = img.width;
          let height = img.height;
          if (width > height && width > maxSize) {
            height *= maxSize / width;
            width = maxSize;
          } else if (height > maxSize) {
            width *= maxSize / height;
            height = maxSize;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          const resizedDataUrl = canvas.toDataURL("image/jpeg", 0.8);

          const cleanName = file.name.replace(/\.[^/.]+$/, "");
          appData.items.push({
            id: Date.now() + Math.random(),
            name: cleanName,
            rarity: "R",
            img: resizedDataUrl
          });
          saveData();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function updateItemName(index, val) {
    appData.items[index].name = val;
    saveData();
  }

  function updateItemRarity(index, val) {
    appData.items[index].rarity = val;
    saveData();
  }

  function deleteItem(index) {
    appData.items.splice(index, 1);
    saveData();
  }

  function pullGacha(times) {
    const resultArea = document.getElementById("result-area");
    resultArea.innerHTML = "";

    const totalRate = appData.rates.SSR + appData.rates.SR + appData.rates.R;
    if (totalRate <= 0) {
      alert("排出確率の合計を1%以上にしてね！");
      return;
    }

    for (let i = 0; i < times; i++) {
      const rand = Math.random() * totalRate;
      let chosenRarity = "R";
      if (rand < appData.rates.SSR) {
        chosenRarity = "SSR";
      } else if (rand < appData.rates.SSR + appData.rates.SR) {
        chosenRarity = "SR";
      }

      // 選ばれたレアリティのアイテムを抽出（なければ全体から）
      let pool = appData.items.filter(item => item.rarity === chosenRarity);
      if (pool.length === 0) pool = appData.items;
      if (pool.length === 0) {
        alert("カードが1枚も登録されてへんで！");
        return;
      }

      const picked = pool[Math.floor(Math.random() * pool.length)];

      const card = document.createElement("div");
      card.className = `card ${picked.rarity}`;
      card.style.animationDelay = `${i * 0.08}s`;
      card.innerHTML = `
        <span class="rarity-badge">${picked.rarity}</span>
        <img src="${picked.img}" class="card-img" alt="">
        <div class="card-name">${picked.name}</div>
      `;
      resultArea.appendChild(card);
    }

    appData.totalPulls += times;
    saveData();
  }

  function resetStats() {
    appData.totalPulls = 0;
    saveData();
  }

  function resetAllData() {
    if (confirm("登録した画像や設定を消して、最初のサンプルに戻してもええ？")) {
      appData = JSON.parse(JSON.stringify(defaultData));
      saveData();
    }
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
    const dlAnchor = document.createElement("a");
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", "my_gacha_data.json");
    dlAnchor.click();
  }

  function importData(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (imported.items && imported.rates) {
          appData = imported;
          saveData();
          alert("データを読み込んだで！");
        }
      } catch (err) {
        alert("ファイルの読み込みに失敗したみたい…");
      }
    };
    reader.readAsText(file);
  }

  // 初期化
  updateUI();
</script>
</body>
</html>
