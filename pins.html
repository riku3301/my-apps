<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ブレマイ ピンズ管理・検索</title>
<style>
  :root {
    --bg: #fdf8f7;
    --card: #ffffff;
    --primary: #e88d9c;
    --primary-light: #fcebef;
    --accent: #9c88d9;
    --text: #4a3b3b;
    --text-sub: #8a7575;
    --border: #f0e1e1;
    --gold: #f5b82e;
    --silver: #7fa8d6;
    --gray: #b0a4a4;
  }

  * {
    box-sizing: border-box;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", -apple-system, sans-serif;
  }

  html, body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text);
    padding-bottom: 80px;
    overflow-x: hidden;
    max-width: 100%;
  }

  header {
    background: #fff;
    padding: 10px 12px;
    box-shadow: 0 2px 10px rgba(74, 59, 59, 0.06);
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    max-width: 100%;
  }

  header h1 {
    font-size: 1rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  .header-btns {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    max-width: 100%;
  }

  .btn {
    border: none;
    border-radius: 20px;
    padding: 6px 10px;
    font-size: 0.78rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
    white-space: nowrap;
  }

  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 3px 8px rgba(232, 141, 156, 0.35); }
  .btn-sub { background: var(--primary-light); color: var(--text); }
  .btn-accent { background: #efeafb; color: #5f4996; }
  .btn-danger { background: #ff7b7b; color: #fff; }

  .container {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 12px;
  }

  /* 検索・フィルターエリア */
  .filter-box {
    background: var(--card);
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 4px 12px rgba(74, 59, 59, 0.04);
    margin-bottom: 14px;
    border: 1px solid var(--border);
    max-width: 100%;
  }

  .search-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    min-width: 0;
  }

  .search-input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 0.9rem;
    outline: none;
  }

  .search-input:focus {
    border-color: var(--primary);
  }

  .filter-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  @media (min-width: 600px) {
    .filter-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }

  select {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    padding: 8px 8px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    font-size: 0.82rem;
    outline: none;
  }

  /* 選択中キャラバナー */
  .selected-target-banner {
    display: none;
    align-items: center;
    gap: 10px;
    background: #fff9fa;
    border: 1.5px solid var(--primary-light);
    border-radius: 14px;
    padding: 8px 12px;
    margin-top: 10px;
    font-size: 0.85rem;
  }
  .selected-target-banner.show {
    display: flex;
  }
  .banner-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--primary-light);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.82rem;
    color: var(--text-sub);
    flex-wrap: wrap;
    gap: 8px;
  }

  /* ピンズ一覧カード */
  .pin-list {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }

  @media (min-width: 640px) {
    .pin-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  .pin-card {
    background: var(--card);
    border-radius: 16px;
    padding: 10px 10px;
    box-shadow: 0 3px 10px rgba(74, 59, 59, 0.04);
    border: 1.5px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    position: relative;
    min-width: 0;
    max-width: 100%;
  }

  .pin-card.eval-◎ { border-left: 5px solid var(--gold); background: linear-gradient(to right, #fffdf5, #ffffff); }
  .pin-card.eval-△ { border-left: 5px solid var(--silver); }
  .pin-card.eval-× { border-left: 5px solid #e0d5d5; }

  .pin-thumb {
    width: 50px;
    height: 50px;
    border-radius: 11px;
    background: var(--primary-light);
    object-fit: cover;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    color: var(--text-sub);
    text-align: center;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .pin-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .pin-info {
    flex: 1;
    min-width: 0;
  }

  .pin-top {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 3px;
    flex-wrap: wrap;
  }

  .badge-dept {
    font-size: 0.66rem;
    padding: 1px 6px;
    border-radius: 8px;
    background: #f0ebf8;
    color: #6a569e;
    font-weight: bold;
  }

  .pin-target {
    font-weight: bold;
    font-size: 0.88rem;
  }

  .badge-eval {
    font-size: 0.72rem;
    font-weight: bold;
    padding: 1px 6px;
    border-radius: 8px;
  }
  .badge-eval.◎ { background: #fff0c2; color: #b87b00; }
  .badge-eval.△ { background: #e3f0ff; color: #366da8; }
  .badge-eval.× { background: #f2ecec; color: #8c7b7b; }

  .badge-lv {
    font-size: 0.66rem;
    background: var(--primary);
    color: #fff;
    padding: 1px 5px;
    border-radius: 6px;
    font-weight: bold;
  }

  .pin-effect {
    font-size: 0.83rem;
    color: var(--text);
    margin-bottom: 2px;
    line-height: 1.3;
  }

  .pin-val {
    font-weight: bold;
    color: #d65a6e;
    margin-left: 4px;
  }

  .pin-illust {
    font-size: 0.76rem;
    color: var(--text-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pin-memo {
    display: inline-block;
    margin-left: 4px;
    color: #d9822b;
    font-weight: bold;
  }

  .card-right {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  .mini-char-thumb {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #f5f0f7;
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  .mini-char-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .btn-edit {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px 8px;
    font-size: 0.74rem;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }

  /* モーダル */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(50, 40, 40, 0.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  .modal h2 {
    margin: 0 0 14px;
    font-size: 1.05rem;
    border-bottom: 2px solid var(--primary-light);
    padding-bottom: 8px;
  }

  .form-group {
    margin-bottom: 12px;
    min-width: 0;
  }

  .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: bold;
    margin-bottom: 4px;
    color: var(--text);
  }

  .form-group input[type="text"],
  .form-group input[type="number"],
  .form-group select {
    width: 100%;
    min-width: 0;
    padding: 8px 10px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.92rem;
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .img-preview-box {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .img-preview {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: var(--primary-light);
    object-fit: cover;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .hint-text {
    font-size: 0.72rem;
    color: var(--text-sub);
    margin-top: 4px;
  }

  /* キャラマスタ一覧 */
  .master-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }

  .master-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fffdfd;
    min-width: 0;
  }

  .master-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .master-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--primary-light);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: var(--text-sub);
    overflow: hidden;
  }

  .master-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>

<header>
  <h1>📌 ブレマイピンズ帳</h1>
  <div class="header-btns">
    <button class="btn btn-accent" onclick="openMasterModal()">キャラマスタ</button>
    <button class="btn btn-sub" onclick="openBackupModal()">データ管理</button>
    <button class="btn btn-primary" onclick="openEditModal()">＋ 新規登録</button>
  </div>
</header>

<div class="container">
  <div class="filter-box">
    <div class="search-row">
      <input type="text" id="search-keyword" class="search-input" placeholder="イラスト名・対象・効果・備考で検索..." oninput="renderList()">
      <button class="btn btn-sub" onclick="resetFilters()">クリア</button>
    </div>
    <div class="filter-grid">
      <select id="filter-target" onchange="onFilterTargetChange()">
        <option value="">対象：すべて</option>
      </select>
      <select id="filter-dept" onchange="renderList()">
        <option value="">部署：すべて</option>
        <option value="本部">本部</option>
        <option value="交際部">交際部</option>
        <option value="管理部">管理部</option>
        <option value="強行部">強行部</option>
        <option value="交渉部">交渉部</option>
        <option value="特務部">特務部</option>
        <option value="すべて">すべて（共通）</option>
      </select>
      <select id="filter-effect" onchange="renderList()">
        <option value="">効果：すべて</option>
        <option value="オーラ">オーラ</option>
        <option value="ビジュアル">ビジュアル</option>
        <option value="カリスマ">カリスマ</option>
        <option value="全てのステータス">全てのステータス</option>
        <option value="オートスキル">オートスキル</option>
        <option value="コンビネーションスキル">コンビネーションスキル</option>
        <option value="SPスキルコスト">SPスキルコスト</option>
      </select>
      <select id="filter-eval" onchange="renderList()">
        <option value="">評価：すべて</option>
        <option value="◎">◎（全体最高効率）</option>
        <option value="△">△（中間）</option>
        <option value="×">×（全体最低効率）</option>
      </select>
    </div>

    <div id="selected-target-banner" class="selected-target-banner">
      <img id="banner-target-img" class="banner-avatar" src="" alt="">
      <div>
        <strong id="banner-target-name"></strong>
        <span id="banner-target-dept" class="badge-dept" style="margin-left:6px;"></span>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span>表示件数：<strong id="count-display">0</strong> 件（全体基準：最高＝◎ / 最低＝×）</span>
    <div style="display:flex; align-items:center; gap:6px;">
      <span>並び替え：</span>
      <select id="sort-order" style="width:auto; padding:5px 8px;" onchange="renderList()">
        <option value="default">キャラ順（標準）</option>
        <option value="val-desc">数値が高い順</option>
        <option value="newest">新しい登録順</option>
      </select>
    </div>
  </div>

  <div id="pin-list" class="pin-list"></div>
</div>

<!-- ピンズ登録・編集モーダル -->
<div id="edit-modal" class="modal-overlay" onclick="closeModalOnBg(event, 'edit-modal')">
  <div class="modal">
    <h2 id="modal-title">ピンズ新規登録</h2>
    <input type="hidden" id="edit-id">

    <div class="form-row">
      <div class="form-group">
        <label>対象（キャラ / レア）</label>
        <select id="input-target" onchange="onTargetChange()"></select>
      </div>
      <div class="form-group">
        <label>部署（マスタ自動入力）</label>
        <input type="text" id="input-dept" readonly style="background:#f9f4f4;">
      </div>
    </div>

    <div class="form-group">
      <label>イラスト名</label>
      <input type="text" id="input-illust" placeholder="例：月浮かぶ空ドリンク、明星（顔）">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>効果</label>
        <select id="input-effect" onchange="onEffectOrValChange()">
          <option value="オーラ">オーラ</option>
          <option value="ビジュアル">ビジュアル</option>
          <option value="カリスマ">カリスマ</option>
          <option value="全てのステータス">全てのステータス</option>
          <option value="オートスキル">オートスキル</option>
          <option value="コンビネーションスキル">コンビネーションスキル</option>
          <option value="SPスキルコスト">SPスキルコスト</option>
        </select>
      </div>
      <div class="form-group">
        <label id="label-val">数値（%）</label>
        <input type="number" step="0.1" id="input-val" placeholder="例：6.0" oninput="onEffectOrValChange()">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>評価（全体基準で自動判定）</label>
        <input type="text" id="input-eval-preview" readonly style="background:#f9f4f4; font-weight:bold;">
        <div class="hint-text">保存時に全ピンズの最高/最低と自動比較されます</div>
      </div>
      <div class="form-group">
        <label>レベル</label>
        <input type="text" id="input-level" placeholder="例：5（空欄OK）">
      </div>
    </div>

    <div class="form-group">
      <label>備考</label>
      <input type="text" id="input-memo" placeholder="例：★、お気に入りなど">
    </div>

    <div class="form-group">
      <label>ピンズ画像（カード左側に表示）</label>
      <div class="img-preview-box">
        <img id="input-img-preview" class="img-preview" src="" alt="">
        <div style="flex:1; min-width:0;">
          <input type="file" id="input-img-file" accept="image/*" onchange="handlePinImageUpload(this.files[0])" style="font-size:0.78rem; max-width:100%;">
          <button type="button" class="btn btn-sub" style="margin-top:5px; padding:4px 8px; font-size:0.75rem;" onclick="clearPinImage()">ピンズ画像を消す</button>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" id="btn-delete" class="btn btn-danger" onclick="deletePin()" style="display:none;">削除</button>
      <div style="display:flex; gap:8px; margin-left:auto;">
        <button type="button" class="btn btn-sub" onclick="closeModal('edit-modal')">キャンセル</button>
        <button type="button" class="btn btn-primary" onclick="savePin()">保存する</button>
      </div>
    </div>
  </div>
</div>

<!-- キャラマスタ管理モーダル -->
<div id="master-modal" class="modal-overlay" onclick="closeModalOnBg(event, 'master-modal')">
  <div class="modal">
    <h2>キャラマスタ・画像管理</h2>

    <div style="background:#fdf8f7; border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:14px;">
      <strong id="master-form-title" style="display:block; margin-bottom:10px; font-size:0.9rem;">＋ キャラマスタ新規追加</strong>
      <input type="hidden" id="master-edit-index">

      <div class="form-row">
        <div class="form-group">
          <label>対象名（キャラ / レア）</label>
          <input type="text" id="master-name" placeholder="例：樋宮 明星">
        </div>
        <div class="form-group">
          <label>部署</label>
          <select id="master-dept">
            <option value="本部">本部</option>
            <option value="交際部">交際部</option>
            <option value="管理部">管理部</option>
            <option value="強行部">強行部</option>
            <option value="交渉部">交渉部</option>
            <option value="特務部">特務部</option>
            <option value="すべて">すべて</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>並び順（ソート番号）</label>
          <input type="number" id="master-sort" placeholder="例：6">
        </div>
        <div class="form-group">
          <label>キャラ画像（編集ボタンの左に表示）</label>
          <div class="img-preview-box">
            <img id="master-img-preview" class="img-preview" style="width:42px; height:42px; border-radius:50%;" src="" alt="">
            <div style="flex:1; min-width:0;">
              <input type="file" id="master-img-file" accept="image/*" onchange="handleMasterImageUpload(this.files[0])" style="font-size:0.74rem; max-width:100%;">
              <button type="button" class="btn btn-sub" style="margin-top:4px; padding:3px 7px; font-size:0.7rem;" onclick="clearMasterImage()">画像削除</button>
            </div>
          </div>
        </div>
      </div>

      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:6px;">
        <button type="button" id="btn-master-cancel" class="btn btn-sub" onclick="resetMasterForm()" style="display:none;">入力クリア</button>
        <button type="button" class="btn btn-primary" onclick="saveMasterItem()">マスタに保存</button>
      </div>
    </div>

    <div style="font-size:0.85rem; font-weight:bold; color:var(--text-sub);">登録済みキャラマスタ一覧（タップで編集）</div>
    <div id="master-list" class="master-list"></div>

    <div class="modal-actions">
      <button type="button" class="btn btn-sub" onclick="resetMasterToInitial()">初期マスタに戻す</button>
      <button type="button" class="btn btn-primary" onclick="closeModal('master-modal')">完了</button>
    </div>
  </div>
</div>

<!-- バックアップ・データ管理モーダル -->
<div id="backup-modal" class="modal-overlay" onclick="closeModalOnBg(event, 'backup-modal')">
  <div class="modal">
    <h2>データ管理・バックアップ</h2>
    <p style="font-size:0.85rem; color:var(--text-sub); line-height:1.5;">
      ピンズデータ・ピンズ画像・キャラマスタ・キャラ画像はこの端末のブラウザに自動保存されています。
    </p>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
      <button class="btn btn-primary" onclick="exportJSON()">📥 バックアップを書き出す (JSON)</button>
      <button class="btn btn-sub" onclick="document.getElementById('import-json').click()">📤 バックアップを読み込む (JSON)</button>
      <input type="file" id="import-json" accept=".json" style="display:none" onchange="importJSON(this.files[0])">
      <hr style="border:none; border-top:1px solid var(--border); width:100%; margin:8px 0;">
      <button class="btn btn-danger" onclick="resetToInitial()">⚠️ ピンズを最初のスプレッドシート状態に戻す</button>

  function getSortedMaster() {
    return [...targetMaster].sort((a, b) => (Number(a.sort) || 999) - (Number(b.sort) || 999));
  }

  function getMasterByTarget(targetName) {
    return targetMaster.find(m => m.target === targetName);
  }

  function getEffectMinMaxMap(list) {
    const map = {};
    list.forEach(p => {
      const num = Number(p.val);
      if (isNaN(num)) return;
      if (!map[p.effect]) {
        map[p.effect] = { max: num, min: num };
      } else {
        if (num > map[p.effect].max) map[p.effect].max = num;
        if (num < map[p.effect].min) map[p.effect].min = num;
      }
    });
    return map;
  }

  function calcDynamicEval(pin, minMaxMap) {
    const mm = minMaxMap[pin.effect];
    const num = Number(pin.val);
    if (!mm || isNaN(num)) return "";
    if (num >= mm.max) return "◎";
    if (num <= mm.min) return "×";
    return "△";
  }

  function refreshTargetSelects() {
    const filterTarget = document.getElementById("filter-target");
    const inputTarget = document.getElementById("input-target");
    const prevFilter = filterTarget.value;
    const prevInput = inputTarget.value;

    filterTarget.innerHTML = '<option value="">対象：すべて</option>';
    inputTarget.innerHTML = '';

    getSortedMaster().forEach(m => {
      const opt1 = document.createElement("option");
      opt1.value = m.target;
      opt1.textContent = m.target;
      filterTarget.appendChild(opt1);

      const opt2 = document.createElement("option");
      opt2.value = m.target;
      opt2.textContent = m.target;
      inputTarget.appendChild(opt2);
    });

    if ([...filterTarget.options].some(o => o.value === prevFilter)) {
      filterTarget.value = prevFilter;
    }
    if ([...inputTarget.options].some(o => o.value === prevInput)) {
      inputTarget.value = prevInput;
    } else if (inputTarget.options.length > 0) {
      inputTarget.selectedIndex = 0;
    }
    updateSelectedTargetBanner();
  }

  function updateSelectedTargetBanner() {
    const val = document.getElementById("filter-target").value;
    const banner = document.getElementById("selected-target-banner");
    if (!val) {
      banner.classList.remove("show");
      return;
    }
    const m = getMasterByTarget(val);
    document.getElementById("banner-target-name").textContent = val;
    document.getElementById("banner-target-dept").textContent = m ? m.dept : "";
    const imgEl = document.getElementById("banner-target-img");
    if (m && m.img) {
      imgEl.src = m.img;
      imgEl.style.display = "block";
    } else {
      imgEl.style.display = "none";
    }
    banner.classList.add("show");
  }

  function renderList() {
    const kw = document.getElementById("search-keyword").value.trim().toLowerCase();
    const fTarget = document.getElementById("filter-target").value;
    const fDept = document.getElementById("filter-dept").value;
    const fEffect = document.getElementById("filter-effect").value;
    const fEval = document.getElementById("filter-eval").value;
    const sortOrder = document.getElementById("sort-order").value;

    const globalMinMax = getEffectMinMaxMap(pinsData);
    const evaluatedAll = pinsData.map(p => {
      const m = getMasterByTarget(p.target);
      return {
        ...p,
        dept: m ? m.dept : p.dept,
        sort: m ? (Number(m.sort) || 99) : (p.sort || 99),
        charImg: m ? (m.img || "") : "",
        eval: calcDynamicEval(p, globalMinMax)
      };
    });

    let filtered = evaluatedAll.filter(p => {
      if (fTarget && p.target !== fTarget) return false;
      if (fDept && p.dept !== fDept) return false;
      if (fEffect && p.effect !== fEffect) return false;
      if (fEval && p.eval !== fEval) return false;
      if (kw) {
        const text = `${p.target} ${p.dept} ${p.effect} ${p.illust} ${p.memo}`.toLowerCase();
        if (!text.includes(kw)) return false;
      }
      return true;
    });

    if (sortOrder === "default") {
      filtered.sort((a, b) => (a.sort - b.sort) || (a.id - b.id));
    } else if (sortOrder === "val-desc") {
      filtered.sort((a, b) => (b.val - a.val) || (a.sort - b.sort));
    } else if (sortOrder === "newest") {
      filtered.sort((a, b) => b.id - a.id);
    }

    document.getElementById("count-display").textContent = filtered.length;
    const listEl = document.getElementById("pin-list");
    listEl.innerHTML = "";

    filtered.forEach(p => {
      const card = document.createElement("div");
      card.className = `pin-card eval-${p.eval || "none"}`;

      const pinThumbHtml = p.img
        ? `<img src="${p.img}" alt="">`
        : `<span>No<br>Img</span>`;

      const miniCharHtml = p.charImg
        ? `<img src="${p.charImg}" alt="">`
        : `<span>${p.target.slice(0, 1)}</span>`;

      const evalBadge = p.eval ? `<span class="badge-eval ${p.eval}">${p.eval}</span>` : "";
      const lvBadge = p.level ? `<span class="badge-lv">Lv.${p.level}</span>` : "";
      const memoHtml = p.memo ? `<span class="pin-memo">${p.memo}</span>` : "";
      const valText = p.val !== "" && p.val !== null ? `${Number(p.val).toFixed(1)}${p.unit || "%"}` : "";

      card.innerHTML = `
        <div class="pin-thumb">${pinThumbHtml}</div>
        <div class="pin-info">
          <div class="pin-top">
            <span class="badge-dept">${p.dept}</span>
            <span class="pin-target">${p.target}</span>
            ${evalBadge}
            ${lvBadge}
          </div>
          <div class="pin-effect">${p.effect}<span class="pin-val">${valText}</span></div>
          <div class="pin-illust">🎨 ${p.illust || "（名称なし）"}${memoHtml}</div>
        </div>
        <div class="card-right">
          <div class="mini-char-thumb" title="${p.target}">${miniCharHtml}</div>
          <button class="btn-edit" onclick="openEditModal(${p.id})">編集</button>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function onEffectOrValChange() {
    const eff = document.getElementById("input-effect").value;
    const unit = EFFECT_UNITS[eff] || "%";
    document.getElementById("label-val").textContent = `数値（${unit}）`;

    const raw = document.getElementById("input-val").value;
    const previewEl = document.getElementById("input-eval-preview");
    if (raw === "" || isNaN(parseFloat(raw))) {
      previewEl.value = "（数値入力後に判定）";
      return;
    }

    const val = parseFloat(raw);
    const editId = Number(document.getElementById("edit-id").value);
    const simulated = pinsData
      .filter(p => p.id !== editId)
      .concat([{ id: editId || -1, effect: eff, val }]);
    const mmMap = getEffectMinMaxMap(simulated);
    const ev = calcDynamicEval({ effect: eff, val }, mmMap);
    previewEl.value = ev ? `${ev}（全体基準）` : "—";
  }

  function resizeImageToDataUrl(file, maxSize, callback) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h *= maxSize / w; w = maxSize; }
        else if (h > maxSize) { w *= maxSize / h; h = maxSize; }
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function savePin() {
    const idVal = document.getElementById("edit-id").value;
    const target = document.getElementById("input-target").value;
    const dept = document.getElementById("input-dept").value;
    const illust = document.getElementById("input-illust").value.trim();
    const effect = document.getElementById("input-effect").value;
    const valRaw = document.getElementById("input-val").value;
    const val = valRaw !== "" ? parseFloat(valRaw) : 0;
    const level = document.getElementById("input-level").value.trim();
    const memo = document.getElementById("input-memo").value.trim();

    const masterObj = getMasterByTarget(target);
    const sort = masterObj ? (Number(masterObj.sort) || 99) : 99;
    const unit = EFFECT_UNITS[effect] || "%";

    if (idVal) {
      const idx = pinsData.findIndex(p => p.id === Number(idVal));
      if (idx !== -1) {
        pinsData[idx] = { ...pinsData[idx], sort, target, dept, effect, val, unit, level, illust, memo, img: currentPinImg };
      }
    } else {
      const maxId = pinsData.reduce((max, p) => Math.max(max, p.id), 0);
      pinsData.push({
        id: maxId + 1,
        sort, target, dept, effect, val, unit, level, illust, memo, img: currentPinImg
      });
    }

    saveAllStorage();
    renderList();
    closeModal("edit-modal");
  }

  function deletePin() {
    const idVal = Number(document.getElementById("edit-id").value);
    if (!idVal) return;
    if (confirm("このピンズデータを削除してもええ？")) {
      pinsData = pinsData.filter(p => p.id !== idVal);
      saveAllStorage();
      renderList();
      closeModal("edit-modal");

  }

  function saveMasterItem() {
    const name = document.getElementById("master-name").value.trim();
    const dept = document.getElementById("master-dept").value;
    const sortNum = parseInt(document.getElementById("master-sort").value, 10);
    const sort = isNaN(sortNum) ? 99 : sortNum;
    const editIdxStr = document.getElementById("master-edit-index").value;

    if (!name) {
      alert("対象名（キャラ名など）を入力してね！");
      return;
    }

    if (editIdxStr !== "") {
      const idx = Number(editIdxStr);
      const oldName = targetMaster[idx].target;
      targetMaster[idx] = { target: name, dept, sort, img: currentMasterImg };
      if (oldName !== name) {
        pinsData.forEach(p => {
          if (p.target === oldName) p.target = name;
        });
      }
    } else {
      const existingIdx = targetMaster.findIndex(m => m.target === name);
      if (existingIdx !== -1) {
        targetMaster[existingIdx] = { target: name, dept, sort, img: currentMasterImg };
      } else {
        targetMaster.push({ target: name, dept, sort, img: currentMasterImg });
      }
    }

    saveAllStorage();
    refreshTargetSelects();
    renderMasterList();
    renderList();
    resetMasterForm();
  }

  function deleteMasterItem(idx) {
    const item = targetMaster[idx];
    if (!item) return;
    if (confirm(`キャラマスタから「${item.target}」を削除してもええ？（ピンズ自体のデータは残るよ）`)) {
      targetMaster.splice(idx, 1);
      saveAllStorage();
      refreshTargetSelects();
      renderMasterList();
      renderList();
    }
  }

  function renderMasterList() {
    const listEl = document.getElementById("master-list");
    listEl.innerHTML = "";
    const sorted = [...targetMaster]
      .map((item, idx) => ({ item, idx }))
      .sort((a, b) => (Number(a.item.sort) || 999) - (Number(b.item.sort) || 999));

    sorted.forEach(({ item, idx }) => {
      const row = document.createElement("div");
      row.className = "master-item";
      const avatarHtml = item.img
        ? `<img src="${item.img}" alt="">`
        : `<span>${item.target.slice(0, 2)}</span>`;

      row.innerHTML = `
        <div class="master-left" style="cursor:pointer; flex:1;" onclick="editMasterItem(${idx})">
          <div class="master-avatar">${avatarHtml}</div>
          <div>
            <div style="font-weight:bold; font-size:0.9rem;">${item.target}</div>
            <div style="font-size:0.75rem; color:var(--text-sub);">ソート：${item.sort} / 部署：${item.dept}</div>
          </div>
        </div>
        <div style="display:flex; gap:6px;">
          <button type="button" class="btn-edit" onclick="editMasterItem(${idx})">編集</button>
          <button type="button" class="btn-edit" style="color:#d65a6e;" onclick="deleteMasterItem(${idx})">削除</button>
        </div>
      `;
      listEl.appendChild(row);
    });
  }

  function exportJSON() {

    const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload));
    const a = document.createElement("a");
    a.href = str;
    a.download = "buremy_pins_and_master_backup.json";

  function importJSON(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (Array.isArray(parsed)) {
          pinsData = parsed;
        } else if (parsed && Array.isArray(parsed.pins)) {
          pinsData = parsed.pins;
          if (Array.isArray(parsed.master)) {
            targetMaster = parsed.master;
          }
        } else {
          alert("形式が合わへんみたい…");
          return;
        }
        saveAllStorage();
        refreshTargetSelects();
        renderList();
        closeModal("backup-modal");
        alert("バックアップを読み込んだで！");
      } catch (err) {
        alert("読み込みに失敗したみたい…");
      }
    };
    reader.readAsText(file);
  }

    if (confirm("手入力で追加・編集したピンズを消して、最初のスプレッドシート状態に戻してもええ？")) {

  }

  renderList();
</script>
